{% extends "base.html" %}
{% block title %}Simulador de Hipoteca - Altum{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">Simulador de Hipoteca ALTUM</h2>
                    <p class="text-muted">Calcula de forma rápida y sencilla la cuota mensual de tu préstamo hipotecario.</p>
                </div>

                <!-- Formulario POST -->
                <form method="POST">
                    <div class="mb-3">
                        <label for="capital" class="form-label fw-semibold">Capital solicitado (€)</label>
                        <input type="number" step="any" class="form-control" id="capital" name="capital" 
                        value="{{ capital }}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="interes" class="form-label fw-semibold">Tipo de Interés Anual (%)</label>
                            <input type="number" step="any" class="form-control" id="interes" name="interes" 
                                value="{{ interes }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="anos" class="form-label fw-semibold">Plazo (Años)</label>
                        <input type="number" class="form-control" id="anos" name="anos" 
                            value="{{ anos }}" required>
                    </div>
                    <button type="submit" class="btn btn-light w-100 py-3 fw-bold rounded-pill mt-3" style="background-color: #83b3c9;">
                        Calcular Cuota Mensual
                    </button>
                </form>

            </div>

        </div>
    </div>
</div>
{% endblock %}
